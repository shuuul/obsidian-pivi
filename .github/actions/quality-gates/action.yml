name: Quality gates
description: Shared dependency audit, typecheck, lint, boundaries, coverage, build, and bundle-size gates
inputs:
  run-coverage:
    description: Run coverage in this job. Set to false only when another required job runs coverage.
    default: "true"
runs:
  using: composite
  steps:
    - name: Dependency audit
      shell: bash
      run: npm run check:dependencies

    - name: Typecheck
      shell: bash
      run: npm run typecheck

    - name: Type-aware Oxlint
      shell: bash
      run: npm run lint:oxc

    - name: ESLint compatibility checks
      shell: bash
      run: npm run lint:eslint

    - name: Architecture boundaries
      shell: bash
      run: npm run check:boundaries

    - name: Test with coverage
      if: inputs.run-coverage == 'true'
      shell: bash
      run: npm run test:coverage

    - name: Build
      shell: bash
      run: npm run build

    - name: Bundle size gate
      shell: bash
      run: npm run check:bundle-size
