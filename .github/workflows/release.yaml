name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is-prerelease: ${{ steps.metadata.outputs.is-prerelease }}
      release-tag: ${{ steps.metadata.outputs.release-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag checkout
        run: |
          tag="${GITHUB_REF_NAME}"
          expected_ref="refs/tags/${tag}"
          if [ "${GITHUB_REF}" != "$expected_ref" ]; then
            echo "Release workflow must run from $expected_ref, not ${GITHUB_REF}."
            exit 1
          fi

          tag_commit="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          checked_out_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$GITHUB_SHA" ] || [ "$checked_out_commit" != "$GITHUB_SHA" ]; then
            echo "Tag, event, and checkout must resolve to the same commit."
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag" == v* ]]; then
            echo "Obsidian plugin releases must not use a leading 'v' tag. Use '${package_version}', not '$tag'."
            exit 1
          fi
          if [ "$package_version" != "$tag" ]; then
            echo "package.json version ($package_version) does not match tag ($tag)"
            exit 1
          fi

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Resolve release metadata
        id: metadata
        run: |
          tag="${GITHUB_REF_NAME}"
          package_version="$(node -p "require('./package.json').version")"

          if node -e "process.exit(require('semver').prerelease('$package_version') ? 0 : 1)"; then
            is_prerelease=true
          else
            is_prerelease=false
          fi

          echo "is-prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          echo "release-tag=$tag" >> "$GITHUB_OUTPUT"
          echo "IS_PRERELEASE=$is_prerelease" >> "$GITHUB_ENV"
          echo "RELEASE_TAG_RESOLVED=${tag}" >> "$GITHUB_ENV"

      # Publication depends on the same mandatory gates as CI for this exact tag commit.
      - name: Quality gates
        uses: ./.github/actions/quality-gates

      - name: Prepare release manifest
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            node scripts/write-release-manifest.js
          else
            manifest_version="$(node -p "require('./manifest.json').version")"
            if [ "$manifest_version" != "$RELEASE_TAG_RESOLVED" ]; then
              echo "manifest.json version ($manifest_version) does not match tag ($RELEASE_TAG_RESOLVED)"
              exit 1
            fi
          fi

          release_manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "$release_manifest_version" != "$RELEASE_TAG_RESOLVED" ]; then
            echo "Release manifest version ($release_manifest_version) does not match tag ($RELEASE_TAG_RESOLVED)"
            exit 1
          fi

          for file in main.js manifest.json styles.css; do
            if [ ! -f "$file" ]; then
              echo "Missing release artifact: $file"
              exit 1
            fi
          done

      - name: Prepare release notes
        run: |
          notes_file="${RUNNER_TEMP}/release-notes.md"
          awk -v version="$RELEASE_TAG_RESOLVED" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"

          if ! grep -q '[^[:space:]]' "$notes_file"; then
            if [ "$IS_PRERELEASE" = "true" ]; then
              previous_tag="$(git describe --tags --abbrev=0 "${RELEASE_TAG_RESOLVED}^")"
              node scripts/generate-beta-release-notes.js \
                "$previous_tag" \
                "$RELEASE_TAG_RESOLVED" \
                "$GITHUB_REPOSITORY" > "$notes_file"
            else
              echo "CHANGELOG.md has no non-empty section for $RELEASE_TAG_RESOLVED."
              exit 1
            fi
          fi

          if ! grep -q '[^[:space:]]' "$notes_file"; then
            echo "Release notes are empty for $RELEASE_TAG_RESOLVED."
            exit 1
          fi

          echo "RELEASE_NOTES_FILE=${notes_file}" >> "$GITHUB_ENV"

      - name: Stage release bundle
        run: |
          mkdir release-bundle
          cp main.js manifest.json styles.css "$RELEASE_NOTES_FILE" release-bundle/

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.metadata.outputs.release-tag }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.build.outputs.release-tag }}
          path: release-bundle

      - name: Create or update GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.build.outputs.is-prerelease }}
          RELEASE_NOTES_FILE: release-bundle/release-notes.md
          RELEASE_TAG_RESOLVED: ${{ needs.build.outputs.release-tag }}
        run: |
          prerelease_flag=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            prerelease_flag="--prerelease"
          fi

          if gh release view "$RELEASE_TAG_RESOLVED" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG_RESOLVED" \
              --title "$RELEASE_TAG_RESOLVED" \
              --notes-file "$RELEASE_NOTES_FILE" \
              $prerelease_flag
            gh release upload "$RELEASE_TAG_RESOLVED" \
              release-bundle/main.js release-bundle/manifest.json release-bundle/styles.css \
              --clobber
          else
            gh release create "$RELEASE_TAG_RESOLVED" \
              --title="$RELEASE_TAG_RESOLVED" \
              --notes-file "$RELEASE_NOTES_FILE" \
              $prerelease_flag \
              release-bundle/main.js release-bundle/manifest.json release-bundle/styles.css
          fi

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_RESOLVED: ${{ needs.build.outputs.release-tag }}
        run: |
          download_dir="${RUNNER_TEMP}/published-release-assets"
          mkdir -p "$download_dir"
          gh release download "$RELEASE_TAG_RESOLVED" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$download_dir" \
            --pattern main.js \
            --pattern manifest.json \
            --pattern styles.css

          for file in main.js manifest.json styles.css; do
            if ! cmp --silent "release-bundle/$file" "$download_dir/$file"; then
              echo "Published asset differs from the tag build: $file"
              exit 1
            fi
          done

          sha256sum "$download_dir/main.js" \
            "$download_dir/manifest.json" \
            "$download_dir/styles.css"
